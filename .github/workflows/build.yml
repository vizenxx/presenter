# Builds the app zips (nothing to install): Presenter-<version>-mac-arm64.zip (Apple silicon),
# Presenter-<version>-mac-x64.zip (Intel) and Presenter-<version>-win.zip, each with a reduced
# LibreOffice inside (scripts/libreoffice.mjs: the official release, checked against its SHA-256),
# then publishes them on the Releases page ("Latest") with the download steps from
# .github/release-notes.md. Run it from the Actions tab ("Run workflow"); untick "publish" for a
# test build (the zips stay on the run page only). Only a run on main can publish.
# A Mac app can only be built on a Mac, which is why this runs on GitHub's Mac machines.
name: Build app zips
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the zips on the Releases page (Latest)
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The LibreOffice downloads are large; keep them between runs (same version = same files).
      - uses: actions/cache@v4
        with:
          path: vendor/cache
          key: libreoffice-${{ runner.os }}-${{ hashFiles('scripts/libreoffice.mjs') }}
      - name: LibreOffice inside the app (Mac, both kinds)
        if: runner.os == 'macOS'
        run: |
          node scripts/libreoffice.mjs prepare --arch arm64
          node scripts/libreoffice.mjs prepare --arch x64
      - name: LibreOffice inside the app (Windows)
        if: runner.os == 'Windows'
        run: node scripts/libreoffice.mjs prepare
      - name: Mac app
        if: runner.os == 'macOS'
        # Ad-hoc signed only (no paid Apple Developer ID): the first open needs
        # System Settings -> Privacy & Security -> Open Anyway, once.
        run: npm run dist:mac -- --publish never
      - name: Windows app
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never
      # The LibreOffice inside each built app: in place, for the right processor, and it converts.
      - name: Check the built apps (Mac)
        if: runner.os == 'macOS'
        run: |
          node scripts/libreoffice.mjs check --arch arm64 --root dist/mac-arm64/Presenter.app/Contents/Resources/libreoffice
          node scripts/libreoffice.mjs check --arch x64 --root dist/mac/Presenter.app/Contents/Resources/libreoffice --no-run
          ls -l dist/*.zip
      - name: Check the built app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/libreoffice.mjs check --root dist/win-unpacked/resources/libreoffice
          ls -l dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: presenter-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error

  # One download page per version. A rebuild of the same version replaces it, so the page
  # and its tag always match the newest build.
  release:
    needs: build
    # Only from main: a test build of another branch can never replace the download page.
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" artifacts/*.zip --target "$GITHUB_SHA" --title "Presenter $version" --notes-file .github/release-notes.md --latest
