# Builds the app zips (nothing to install): Presenter-<version>-mac.zip (Intel and Apple silicon)
# and Presenter-<version>-win.zip, then publishes them on the Releases page ("Latest") with the
# download steps from .github/release-notes.md. Run it from the Actions tab ("Run workflow").
# A Mac app can only be built on a Mac, which is why this runs on GitHub's Mac machines.
name: Build app zips
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Mac app
        if: runner.os == 'macOS'
        # Ad-hoc signed only (no paid Apple Developer ID): the first open needs
        # System Settings -> Privacy & Security -> Open Anyway, once.
        run: npm run dist:mac -- --publish never
      - name: Windows app
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: presenter-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error

  # One download page per version. A rebuild of the same version replaces it, so the page
  # and its tag always match the newest build.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" artifacts/*.zip --target "$GITHUB_SHA" --title "Presenter $version" --notes-file .github/release-notes.md --latest
