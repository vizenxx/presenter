<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>impress fixture</title></head>
  <body class="impress-not-supported">
    <div id="impress" data-transition-duration="0">
      <div class="step" data-x="0"><h1>Impress opening</h1><div class="notes">Impress note one</div></div>
      <div class="step" data-x="1500"><h2>Impress second</h2></div>
      <div class="step" data-x="3000"><h2>Impress third</h2></div>
      <div class="step" data-x="4500"><h2>Impress closing</h2></div>
    </div>
    <script src="impress.js"></script>
    <script>impress().init()</script>
  </body>
</html>
